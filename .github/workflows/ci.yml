name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  main-product:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  mentra-tpa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/mentra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platforms/mentra/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
