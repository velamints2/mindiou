<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MindIOU Rokid Preview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="device">
      <section class="display" aria-label="MindIOU Rokid optical-waveguide preview">
        <header>
          <strong>MINDIOU</strong>
          <span id="progress">— / —</span>
        </header>
        <div class="meta">
          <span id="domain">认知债务</span>
          <span id="status">读取认知欠条</span>
        </div>
        <article>
          <p id="target">准备清偿</p>
          <h1 id="question">正在寻找最近一次 AI 实践留下的理解缺口。</h1>
          <p id="feedback" hidden></p>
          <p id="follow-up" hidden></p>
        </article>
        <nav aria-label="Study controls">
          <button id="restart" type="button">重试</button>
          <button id="source" type="button" disabled>来源</button>
          <button id="end" class="primary" type="button" disabled>结束</button>
        </nav>
        <form id="answer-form">
          <label for="answer">语音回答模拟</label>
          <div>
            <input id="answer" placeholder="模拟眼镜上的口述回答" />
            <button class="primary" type="submit" disabled>回答</button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
