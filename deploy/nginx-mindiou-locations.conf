location = /mindiou {
    return 302 /mindiou/;
}

location = /genesis {
    return 302 /mindiou/#/genesis;
}

location = /mindiou/ {
    return 302 /mindiou/index.html;
}

location /mindiou/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ =404;
}

# MVP-1 ships as a flat dist/mvp1.html; the demo URL is /mindiou/mvp1/.
location = /mindiou/mvp1 {
    return 302 /mindiou/mvp1/;
}

location = /mindiou/mvp1/ {
    root /var/www;
    try_files /mindiou/mvp1.html =404;
}

# Anonymous visitors must not enumerate reports or read another visitor's latest report.
location = /mindiou-api/api/mvp0/reports {
    return 404;
}

location = /mindiou-api/api/rokid/clearance-entry {
    return 404;
}

# Mentra TPA entry: proxied so the backend can enforce Bearer LEARNING_API_TOKEN.
location = /mindiou-api/api/mentra/clearance-entry {
    limit_req zone=mindiou_general burst=10 nodelay;
    proxy_read_timeout 30s;
    proxy_pass http://127.0.0.1:8794/api/mentra/clearance-entry;
}

# Frontend tracking endpoint (page_enter/page_leave/session_end).
# Anonymous visitors can send beacon without auth; backend records to in-memory log.
location = /mindiou-api/api/learn/events {
    limit_req zone=mindiou_general burst=20 nodelay;
    client_max_body_size 32k;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/learn/events;
}

# Admin operations dashboard (independent admin token, not invite code).
location = /mindiou-api/api/admin/stats {
    limit_req zone=mindiou_general burst=10 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/admin/stats;
}

location = /mindiou-api/api/admin/events {
    limit_req zone=mindiou_general burst=10 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/admin/events;
}

location = /mindiou-api/api/admin/users {
    limit_req zone=mindiou_general burst=10 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/admin/users;
}

# Keep the cheap configuration health check public, but do not expose the
# billable live OpenAI probe to anonymous visitors.
location = /mindiou-api/health {
    if ($arg_live = 1) {
        return 404;
    }
    limit_req zone=mindiou_general burst=10 nodelay;
    proxy_pass http://127.0.0.1:8794/health;
}

# 分层健康检查：liveness 与 readiness（均无模型探活，可公网暴露）。
location = /mindiou-api/healthz {
    limit_req zone=mindiou_general burst=10 nodelay;
    proxy_pass http://127.0.0.1:8794/healthz;
}

location = /mindiou-api/readyz {
    limit_req zone=mindiou_general burst=10 nodelay;
    proxy_pass http://127.0.0.1:8794/readyz;
}

location = /mindiou-api/api/access/login {
    limit_req zone=mindiou_general burst=5 nodelay;
    client_max_body_size 8k;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/access/login;
}

location = /mindiou-api/api/access/logout {
    limit_req zone=mindiou_general burst=10 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/access/logout;
}

location = /mindiou-api/api/access/session {
    limit_req zone=mindiou_general burst=10 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/access/session;
}

location = /mindiou-api/api/mvp0/report {
    limit_req zone=mindiou_ai burst=2 nodelay;
    client_max_body_size 512k;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:8794/api/mvp0/report;
}

location = /mindiou-api/api/mvp1/sessions {
    limit_req zone=mindiou_ai burst=2 nodelay;
    client_max_body_size 64k;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:8794/api/mvp1/sessions;
}

location ~ ^/mindiou-api/api/mvp0/reports/[^/]+$ {
    limit_req zone=mindiou_general burst=20 nodelay;
    rewrite ^/mindiou-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8794;
}

location ~ ^/mindiou-api/api/mvp0/reports/[^/]+/cards/[^/]+/answer$ {
    limit_req zone=mindiou_ai burst=3 nodelay;
    client_max_body_size 64k;
    proxy_read_timeout 120s;
    rewrite ^/mindiou-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8794;
}

location ~ ^/mindiou-api/api/mvp0/reports/[^/]+/corrections$ {
    limit_req zone=mindiou_general burst=10 nodelay;
    client_max_body_size 64k;
    rewrite ^/mindiou-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8794;
}

location ~ ^/mindiou-api/api/mvp1/sessions/[^/]+$ {
    limit_req zone=mindiou_general burst=20 nodelay;
    rewrite ^/mindiou-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8794;
}

location ~ ^/mindiou-api/api/mvp1/sessions/[^/]+/answers$ {
    limit_req zone=mindiou_ai burst=3 nodelay;
    client_max_body_size 64k;
    proxy_read_timeout 120s;
    rewrite ^/mindiou-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8794;
}

location ~ ^/mindiou-api/api/mvp1/sessions/[^/]+/end$ {
    limit_req zone=mindiou_general burst=10 nodelay;
    rewrite ^/mindiou-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8794;
}

# ── 账户体系（注册/登录/登出/当前用户/设备 Token）──
location = /mindiou-api/api/auth/register {
    limit_req zone=mindiou_general burst=5 nodelay;
    client_max_body_size 8k;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/auth/register;
}

location = /mindiou-api/api/auth/login {
    limit_req zone=mindiou_general burst=5 nodelay;
    client_max_body_size 8k;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/auth/login;
}

location = /mindiou-api/api/auth/logout {
    limit_req zone=mindiou_general burst=10 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/auth/logout;
}

location = /mindiou-api/api/auth/me {
    limit_req zone=mindiou_general burst=20 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/auth/me;
}

location = /mindiou-api/api/auth/device-tokens {
    limit_req zone=mindiou_general burst=10 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/auth/device-tokens;
}

location = /mindiou-api/api/auth/device-token {
    limit_req zone=mindiou_general burst=10 nodelay;
    client_max_body_size 8k;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/auth/device-token;
}

location ~ ^/mindiou-api/api/auth/device-token/[^/]+$ {
    limit_req zone=mindiou_general burst=10 nodelay;
    rewrite ^/mindiou-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8794;
}

# ── MVP-0 草稿与时间线（创建/读取/修改，需登录）──
location = /mindiou-api/api/mvp0/timelines {
    limit_req zone=mindiou_ai burst=2 nodelay;
    client_max_body_size 512k;
    proxy_read_timeout 120s;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/mvp0/timelines;
}

location = /mindiou-api/api/mvp0/drafts {
    limit_req zone=mindiou_general burst=20 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/mvp0/drafts;
}

location ~ ^/mindiou-api/api/mvp0/drafts/[^/]+$ {
    limit_req zone=mindiou_general burst=20 nodelay;
    client_max_body_size 64k;
    rewrite ^/mindiou-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8794;
}

# ── 训练系统（今日复训/欠条/复训任务）──
location = /mindiou-api/api/training/today {
    limit_req zone=mindiou_general burst=10 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/training/today;
}

location = /mindiou-api/api/training/debts {
    limit_req zone=mindiou_general burst=10 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/training/debts;
}

location ~ ^/mindiou-api/api/training/debts/[^/]+$ {
    limit_req zone=mindiou_general burst=10 nodelay;
    rewrite ^/mindiou-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8794;
