# ── 登录后的认知仪表盘与认知清偿 V1 ──
# These routes are authenticated by Node. Keep them explicit so the public
# catch-all below cannot turn a valid session request into a misleading 404.
location = /mindiou-api/api/dashboard {
    limit_req zone=mindiou_general burst=20 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/dashboard;
}

location = /mindiou-api/api/repayment/status {
    limit_req zone=mindiou_general burst=20 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/repayment/status;
}

location = /mindiou-api/api/repayment/gaps/import {
    limit_req zone=mindiou_general burst=10 nodelay;
    client_max_body_size 64k;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/repayment/gaps/import;
}

location = /mindiou-api/api/repayment/gaps {
    limit_req zone=mindiou_general burst=20 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/repayment/gaps;
}

location ~ ^/mindiou-api/api/repayment/gaps/[^/]+(/attempts)?$ {
    limit_req zone=mindiou_ai burst=3 nodelay;
    client_max_body_size 64k;
    proxy_read_timeout 120s;
    rewrite ^/mindiou-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8794;
}

location = /mindiou-api/api/repayment/review-queue {
    limit_req zone=mindiou_general burst=20 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/repayment/review-queue;
}

location ~ ^/mindiou-api/api/repayment/review-queue/[^/]+/dismiss$ {
    limit_req zone=mindiou_general burst=10 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    rewrite ^/mindiou-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8794;
}

location = /mindiou-api/api/repayment/profile {
    limit_req zone=mindiou_general burst=20 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/repayment/profile;
}

# AI collaboration assessment: structured review of open-ended answers.
# Keep this as an exact location so it is not swallowed by the public 404 catch-all.
location = /mindiou-api/api/assessment/review {
    limit_req zone=mindiou_ai burst=2 nodelay;
    client_max_body_size 128k;
    proxy_read_timeout 120s;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/assessment/review;
}

# ── 001 期永久档案和用户自愿公开设置 ──
location = /mindiou-api/api/genesis {
    limit_req zone=mindiou_general burst=20 nodelay;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/genesis;
}

location = /mindiou-api/api/genesis/identity {
    limit_req zone=mindiou_general burst=10 nodelay;
    client_max_body_size 8k;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8794/api/genesis/identity;
}

# ── 项目认知账本（Node 端继续执行用户认证和项目归属校验）──
# 不把这些路径加入匿名白名单；Nginx 只负责限流、体积限制和去掉公网前缀。
location ~ ^/mindiou-api/api/(projects|work-items|agent-sessions|artifacts|decisions|debts|search)(/|$) {
    limit_req zone=mindiou_general burst=20 nodelay;
    client_max_body_size 12m;
    proxy_read_timeout 60s;
    proxy_set_header X-Forwarded-Proto $scheme;
    rewrite ^/mindiou-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8794;
}

location /mindiou-api/ {
    return 404;
}
