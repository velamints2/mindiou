location = /mindiou {
    return 302 /mindiou/;
}

location = /mindiou/ {
    return 302 /mindiou/report.html;
}

location /mindiou/ {
    root /var/www;
    index report.html index.html;
    try_files $uri $uri/ =404;
}

# Anonymous visitors must not enumerate reports or read another visitor's latest report.
location = /mindiou-api/api/mvp0/reports {
    return 404;
}

location = /mindiou-api/api/rokid/clearance-entry {
    return 404;
}

location = /mindiou-api/api/mvp0/report {
    limit_req zone=mindiou_ai burst=2 nodelay;
    client_max_body_size 512k;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:8794/api/mvp0/report;
}

location = /mindiou-api/api/mvp1/sessions {
    limit_req zone=mindiou_ai burst=2 nodelay;
    client_max_body_size 64k;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:8794/api/mvp1/sessions;
}

location ~ ^/mindiou-api/api/mvp1/sessions/[^/]+/answers$ {
    limit_req zone=mindiou_ai burst=3 nodelay;
    client_max_body_size 64k;
    proxy_read_timeout 120s;
    rewrite ^/mindiou-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8794;
}

location /mindiou-api/ {
    limit_req zone=mindiou_general burst=20 nodelay;
    client_max_body_size 512k;
    proxy_read_timeout 120s;
    rewrite ^/mindiou-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8794;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
