# The SPA performs several parallel health, dashboard, session and asset
# requests during startup.  Keep abuse protection, but leave enough headroom
# for a normal browser (and mobile Safari) without turning transient bursts
# into false 503 "AI unavailable" states.
limit_req_zone $binary_remote_addr zone=mindiou_general:1m rate=120r/m;
limit_req_zone $binary_remote_addr zone=mindiou_ai:1m rate=12r/m;
