# DEPRECATED: IP-only virtual host for 114.67.169.78. Do not use for new
# deployments; the canonical public origin is demo.mindiou.top.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 114.67.169.78;

    ssl_certificate /etc/letsencrypt/live/114.67.169.78/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/114.67.169.78/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/mindiou-locations.conf;

    client_max_body_size 100M;
    root /var/www/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}
